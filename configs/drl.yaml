training:
  total_timesteps: 5000000
  learning_rate: 3.0e-4
  batch_size: 2048
  n_steps: 512
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  n_envs: 16
network:
  card_cnn_channels: [32, 64]
  gru_hidden: 64
  fc_dims: [256, 128]
  action_dim: 6
paths:
  checkpoint_dir: "data/drl_checkpoints/"
  best_model: "data/drl_checkpoints/best_model.pt"
  log_dir: "runs/drl"
